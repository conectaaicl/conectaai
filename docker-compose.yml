version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: conectaai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: conectaai
      POSTGRES_USER: conectaai_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - conectaai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conectaai_user -d conectaai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-condominios:
    build:
      context: ./condominios/backend
      dockerfile: Dockerfile
    container_name: conectaai_backend_condominios
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY}
      FACIAL_ENCRYPTION_KEY: ${FACIAL_ENCRYPTION_KEY}
      DATABASE_URL: postgresql://conectaai_user:${DB_PASSWORD}@db/conectaai
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: "7"
      FLOW_API_KEY: ""
      FLOW_SECRET_KEY: ""
      FLOW_API_URL: "https://www.flow.cl/api"
      RESEND_API_KEY: ""
      MAIL_API_KEY: "${MAIL_API_KEY}"
      MAIL_API_URL: "https://mail.conectaai.cl/api/send"
      MAIL_API_URL_PUBLIC: "https://mail.conectaai.cl"
      MAIL_FROM: "no-reply@conectaai.cl"
      APP_URL: "https://condo.conectaai.cl"
      CRON_SECRET: "${CRON_SECRET}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      META_SYSTEM_TOKEN: ""
      EVOLUTION_API_URL: "http://evolution_api:8080"
      EVOLUTION_API_KEY: "${EVOLUTION_API_KEY}"
      FERNET_KEY: "${FERNET_KEY}"
      META_APP_ID: "${META_APP_ID}"
      META_APP_SECRET: "${META_APP_SECRET}"
      META_VERIFY_TOKEN: "${META_VERIFY_TOKEN}"
      MP_ACCESS_TOKEN: ""
      MP_PUBLIC_KEY: ""
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY}"
      VAPID_EMAIL: "mailto:admin@conectaai.cl"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - default
      - evolution_default
    ports:
      - "127.0.0.1:8003:8003"

  # === MICROSERVICIOS CRITICOS ===

  backend-facial:
    build:
      context: ./condominios/backend
      dockerfile: Dockerfile.facial
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY}
      FACIAL_ENCRYPTION_KEY: ${FACIAL_ENCRYPTION_KEY}
      DATABASE_URL: postgresql://conectaai_user:${DB_PASSWORD}@db/conectaai
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: "7"
      FLOW_API_KEY: ""
      FLOW_SECRET_KEY: ""
      FLOW_API_URL: "https://www.flow.cl/api"
      RESEND_API_KEY: ""
      MAIL_API_KEY: "${MAIL_API_KEY}"
      MAIL_API_URL: "https://mail.conectaai.cl/api/send"
      MAIL_API_URL_PUBLIC: "https://mail.conectaai.cl"
      MAIL_FROM: "no-reply@conectaai.cl"
      APP_URL: "https://condo.conectaai.cl"
      CRON_SECRET: "${CRON_SECRET}"
      ANTHROPIC_API_KEY: ""
      META_SYSTEM_TOKEN: ""
      FERNET_KEY: "${FERNET_KEY}"
      META_APP_ID: "${META_APP_ID}"
      META_APP_SECRET: "${META_APP_SECRET}"
      META_VERIFY_TOKEN: "${META_VERIFY_TOKEN}"
      MP_ACCESS_TOKEN: ""
      MP_PUBLIC_KEY: ""
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY}"
      VAPID_EMAIL: "mailto:admin@conectaai.cl"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8013:8000"

  backend-pagos:
    build:
      context: ./condominios/backend
      dockerfile: Dockerfile.pagos
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY}
      FACIAL_ENCRYPTION_KEY: ${FACIAL_ENCRYPTION_KEY}
      DATABASE_URL: postgresql://conectaai_user:${DB_PASSWORD}@db/conectaai
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_DAYS: "7"
      FLOW_API_KEY: ""
      FLOW_SECRET_KEY: ""
      FLOW_API_URL: "https://www.flow.cl/api"
      RESEND_API_KEY: ""
      MAIL_API_KEY: "${MAIL_API_KEY}"
      MAIL_API_URL: "https://mail.conectaai.cl/api/send"
      MAIL_API_URL_PUBLIC: "https://mail.conectaai.cl"
      MAIL_FROM: "no-reply@conectaai.cl"
      APP_URL: "https://condo.conectaai.cl"
      CRON_SECRET: "${CRON_SECRET}"
      ANTHROPIC_API_KEY: ""
      META_SYSTEM_TOKEN: ""
      FERNET_KEY: "${FERNET_KEY}"
      META_APP_ID: "${META_APP_ID}"
      META_APP_SECRET: "${META_APP_SECRET}"
      META_VERIFY_TOKEN: "${META_VERIFY_TOKEN}"
      MP_ACCESS_TOKEN: ""
      MP_PUBLIC_KEY: ""
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY}"
      VAPID_EMAIL: "mailto:admin@conectaai.cl"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8014:8000"

  # === SERVICIOS COMPARTIDOS ===

  backend-core:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conectaai_backend_core
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      JWT_SECRET: ${CORE_JWT_SECRET}
      DATABASE_URL: postgresql://conectaai_user:${DB_PASSWORD}@db/conectaai
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      CORS_ORIGINS: "https://conectaai.cl,http://localhost:3005"
    ports:
      - "127.0.0.1:8006:8006"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conectaai_frontend
    restart: unless-stopped
    depends_on:
      - backend-condominios
      - backend-core
      - backend-facial
      - backend-pagos
    environment:
      PORT: "3005"
    ports:
      - "127.0.0.1:3005:3005"

volumes:
  conectaai_pgdata:

networks:
  default:
    name: cai_condominios_net
  evolution_default:
    external: true
