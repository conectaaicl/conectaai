# Frontend Next de condo/ventas/wildcard. 3015 es el contenedor "green" que scripts/deploy.sh levanta
# durante un despliegue; normalmente esta apagado y nginx solo usa 3005.
upstream condo_frontend {
    server 127.0.0.1:3005 max_fails=1 fail_timeout=2s;
    server 127.0.0.1:3015 backup;
}
upstream gym_frontend {
    server 127.0.0.1:3006 max_fails=1 fail_timeout=2s;
    server 127.0.0.1:3015 backup;
}
