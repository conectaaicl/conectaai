# Zonas por IP REAL del visitante. Todo pasa por Cloudflare, asi que $binary_remote_addr es la IP
# de Cloudflare y las zonas clasicas cuentan a todos los visitantes como uno. Se usa CF-Connecting-IP
# y, si no viene (acceso directo), la IP de la conexion.
map $http_cf_connecting_ip $ip_real {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $ip_real zone=publico:10m    rate=10r/m;   # leads, demos, invitaciones, aceptar propuesta
limit_req_zone $ip_real zone=login_app:10m  rate=10r/m;   # logins admin/portal/ventas/superadmin
