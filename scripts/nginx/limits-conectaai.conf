# Incluir DENTRO del server {} de condo/ventas/wildcard. Las location regex ganan a "location /".
# Formularios publicos sin sesion: 10/min por IP real, rafaga de 10.
location ~ ^/api/(invitacion/|ventas-terreno/publico/|ventas-terreno/cortinas/publico/|ventas-terreno/(p|cortinas/p|negocios/p|pres)/[^/]+/aceptar) {
    limit_req zone=publico burst=10 nodelay;
    include snippets/proxy-condo.conf;
}
# Logins: 10/min por IP real (el backend ademas corta a 20 en 5 min).
location ~ ^/api/(auth/login|portal/auth/(login|registro)|ventas-terreno/auth/login|superadmin/login)$ {
    limit_req zone=login_app burst=10 nodelay;
    include snippets/proxy-condo.conf;
}
